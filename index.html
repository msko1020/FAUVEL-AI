<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FAUVEL AI</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c0c0e;color:#f7f7f8}header{min-height:64px;border-bottom:1px solid #26262a;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}button,select{background:#242429;color:white;border:1px solid #37373e;border-radius:12px;padding:10px 12px;font:inherit}button{cursor:pointer}button:disabled{opacity:.45}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #a8a8ff}.brand{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}.brand img{width:33px;height:33px}.actions{display:flex;gap:7px;align-items:center}.actions select{max-width:120px;font-size:13px}main{max-width:780px;margin:auto;height:calc(100dvh - 64px);display:flex;flex-direction:column}.messages{flex:1;overflow-y:auto;padding:24px 16px}.welcome{text-align:center;margin:18vh auto 0;max-width:320px}.welcome h1{font-size:27px;margin-bottom:8px}.welcome p{color:#a2a2ad;line-height:1.5}.bubble{padding:13px 16px;border-radius:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.user{background:#292930;margin-left:12%}.assistant{background:#17171b;margin-right:12%;border:1px solid #29292e}.composer{padding:12px 14px max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:end;border-top:1px solid #26262a;background:#0c0c0e}textarea{flex:1;min-height:46px;max-height:150px;resize:vertical;border-radius:16px;background:#222227;color:#fff;border:1px solid #3a3a40;padding:13px;font:inherit}#send{background:#fff;color:#111;font-weight:700}small{color:#858590;display:block;text-align:center;padding-bottom:5px}pre{background:#111;border-radius:10px;padding:10px;overflow-x:auto}@media(max-width:390px){header{padding:8px}.brand{font-size:14px}.actions select{max-width:94px}.actions button{padding:9px}}
</style>
</head>
<body>
<header><div class="brand"><img src="icon.svg" alt="Logo FAUVEL AI">FAUVEL AI</div><div class="actions"><select id="mode" aria-label="Mode de conversation"><option value="general">Général</option><option value="code">Code</option><option value="creative">Créatif</option></select><button id="new">+ Nouveau</button></div></header>
<main><section class="messages" id="messages" aria-live="polite"></section><form class="composer" id="form"><textarea id="prompt" placeholder="Message à FAUVEL AI..." aria-label="Votre message" required></textarea><button id="send" type="submit">↑</button></form><small id="status">FAUVEL AI · Connexion OpenRouter</small></main>
<script>
const API='https://fauvel-ai-api.fauvelangelo1.workers.dev/';
const messages=document.getElementById('messages');
const promptBox=document.getElementById('prompt');
const send=document.getElementById('send');
const mode=document.getElementById('mode');
const status=document.getElementById('status');
let chat=[],busy=false;
try{const saved=JSON.parse(localStorage.getItem('fauvel-chat')||'[]');if(Array.isArray(saved))chat=saved.filter(m=>['user','assistant'].includes(m.role)&&typeof m.text==='string')}catch{}
try{mode.value=localStorage.getItem('fauvel-mode')||'general'}catch{}
mode.addEventListener('change',()=>{try{localStorage.setItem('fauvel-mode',mode.value)}catch{}});
function save(){try{localStorage.setItem('fauvel-chat',JSON.stringify(chat))}catch{}}
function render(){messages.replaceChildren();if(!chat.length){const w=document.createElement('div');w.className='welcome';const h=document.createElement('h1');h.textContent='Comment puis-je t’aider ?';const p=document.createElement('p');p.textContent='Discute avec FAUVEL AI ou demande-lui de générer du code.';w.append(h,p);messages.append(w)}else chat.forEach(m=>{const b=document.createElement('div');b.className='bubble '+m.role;b.textContent=m.text;messages.append(b)});if(busy){const b=document.createElement('div');b.className='bubble assistant';b.textContent='FAUVEL AI réfléchit…';messages.append(b)}messages.scrollTop=messages.scrollHeight}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const text=promptBox.value.trim();if(!text||busy)return;chat.push({role:'user',text});promptBox.value='';busy=true;send.disabled=true;mode.disabled=true;status.textContent='Génération en cours…';save();render();try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode.value,messages:chat.filter(m=>!m.failed).map(m=>({role:m.role,content:m.text}))})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Erreur du serveur ('+response.status+')');if(typeof data.reply!=='string'||!data.reply.trim())throw new Error('Réponse vide du modèle');chat.push({role:'assistant',text:data.reply});save();status.textContent='FAUVEL AI · '+(data.model||'OpenRouter')}catch(err){chat.push({role:'assistant',text:'Erreur de connexion : '+err.message,failed:true});save();status.textContent='Connexion impossible — réessaie'}finally{busy=false;send.disabled=false;mode.disabled=false;render()}});
document.getElementById('new').addEventListener('click',()=>{if(busy)return;chat=[];try{localStorage.removeItem('fauvel-chat')}catch{}status.textContent='FAUVEL AI · Connexion OpenRouter';render()});
render();
</script>
</body>
</html>
