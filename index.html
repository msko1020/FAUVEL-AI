<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0c0e"><meta name="apple-mobile-web-app-capable" content="yes"><title>FAUVEL AI</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0c0c0e;--panel:#17171b;--surface:#25252b;--text:#f7f7f8;--muted:#9999a5;--line:#303037}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,select,textarea,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #aaaaff}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:280px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:18px}.logo{font-size:30px;font-weight:900;letter-spacing:-3px}.side-btn,.icon-btn,.chat-item,.model-select{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px}.side-btn{text-align:left;width:100%}.icon-btn{padding:9px 12px}.chat-list{flex:1;overflow-y:auto;min-height:0}.section-title{color:var(--muted);font-size:12px;margin:10px 0}.chat-item{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;margin-bottom:6px;border-color:transparent}.chat-item.active{background:#303037}.chat-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.delete-btn{border:0;background:transparent;color:#b4b4be;padding:4px 7px;font-size:18px}.settings-btn{border-top:1px solid var(--line);padding-top:14px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:66px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px}.top-left,.top-right{display:flex;align-items:center;gap:10px}.top-title{font-weight:700}.model-select{max-width:155px;font-size:13px}.messages{flex:1;min-height:0;overflow-y:auto;padding:24px 16px}.messages-inner{max-width:780px;margin:auto}.welcome{text-align:center;margin:18vh auto 0;max-width:360px}.welcome-logo{font-size:52px;font-weight:900;letter-spacing:-5px}.welcome h1{font-size:25px;margin:12px 0}.welcome p{color:var(--muted);line-height:1.5}.bubble{padding:13px 16px;border-radius:17px;margin:12px 0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{background:#292930;margin-left:12%}.bubble.assistant{background:#17171b;border:1px solid var(--line);margin-right:12%}.composer-wrap{padding:10px 14px max(12px,env(safe-area-inset-bottom))}.composer{max-width:780px;margin:auto;display:flex;gap:10px;align-items:end;background:#222227;border:1px solid #3a3a40;border-radius:20px;padding:8px}textarea{flex:1;min-width:0;min-height:45px;max-height:170px;resize:vertical;background:transparent;color:var(--text);border:0;outline:none;padding:12px}#send{background:#fff;color:#111;border:0;border-radius:13px;width:45px;height:45px;font-weight:700}.status{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 0}.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:10}.overlay.show{display:block}.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));max-height:90dvh;overflow:auto;background:#1c1c21;border:1px solid #41414a;border-radius:20px;padding:22px;z-index:20;display:none}.modal.show{display:block}.modal h2{margin:0 0 18px}.setting{margin-bottom:20px}.setting label{display:block;margin-bottom:8px;color:#b8b8c3;font-size:14px}.setting select,.setting input[type=email],.setting input[type=password]{width:100%;background:#2b2b32;color:white;border:1px solid #45454d;border-radius:12px;padding:12px}.setting input[type=checkbox]{accent-color:#fff}.setting p{font-size:12px;color:var(--muted);line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.danger{background:#54262b;color:#fff;border:1px solid #773c42;border-radius:12px;padding:11px}.auth-form{display:grid;gap:12px}.auth-form input{width:100%;background:#2b2b32;color:white;border:1px solid #45454d;border-radius:12px;padding:12px}.auth-form button{background:#fff;color:#111;border:0;border-radius:12px;padding:12px;font-weight:700}.auth-links{display:flex;gap:12px;flex-wrap:wrap}.auth-links button{background:none;color:var(--text);border:0;text-decoration:underline;padding:4px}.notice{color:var(--muted);font-size:13px;line-height:1.5;overflow-wrap:anywhere}.light{--bg:#f6f6f8;--panel:#eaeaf0;--surface:#dddde5;--text:#15151a;--muted:#62626c;--line:#d0d0d8;color-scheme:light}.light .chat-item.active{background:#d6d6df}.light .bubble.user{background:#dedee6}.light .bubble.assistant{background:#fff}.light .composer{background:#fff;border-color:#ccc}.light .modal{background:#fff}.light .setting select,.light .setting input[type=email],.light .setting input[type=password],.light .auth-form input{background:#f4f4f7;color:#15151a}.light .delete-btn{color:#555}.light #send,.light .auth-form button{background:#15151a;color:white}@media(max-width:700px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:15;transform:translateX(-105%);transition:transform .2s;width:min(290px,85vw)}.sidebar.open{transform:translateX(0)}.topbar{padding:0 12px}.top-title{font-size:14px}.model-select{max-width:135px}.messages{padding:16px 12px}}
</style></head><body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="logo">F.</span> FAUVEL AI</div><button class="side-btn" id="newChat">＋ Nouvelle conversation</button><div class="chat-list"><div class="section-title">HISTORIQUE</div><div id="chatList"></div></div><div class="settings-btn"><button class="side-btn" id="accountBtn">♙ Compte / Connexion</button><button class="side-btn" id="openSettings">⚙ Paramètres</button></div></aside><div class="main"><header class="topbar"><div class="top-left"><button class="icon-btn" id="menuBtn" aria-label="Ouvrir le menu">☰</button><span class="top-title">FAUVEL AI</span></div><div class="top-right"><select class="model-select" id="model" aria-label="Modèle IA"><option value="general">Gemma 4 31B</option><option value="gemma">Gemma direct</option><option value="code">Code</option><option value="creative">Créatif</option></select><button class="icon-btn" id="quickNew" aria-label="Nouvelle conversation">＋</button></div></header><section class="messages" id="messages" aria-live="polite"><div class="messages-inner" id="messagesInner"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" placeholder="Message à FAUVEL AI..." required></textarea><button id="send" type="submit">↑</button></form><div class="status" id="status">FAUVEL AI · Chargement…</div></div></div></div>
<div class="overlay" id="overlay"></div>
<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-label="Paramètres"><h2>Paramètres</h2><div class="setting"><label for="settingsModel">Modèle par défaut</label><select id="settingsModel"><option value="general">Gemma 4 31B</option><option value="gemma">Gemma direct</option><option value="code">Code</option><option value="creative">Créatif</option></select></div><div class="setting"><label for="theme">Apparence</label><select id="theme"><option value="dark">Sombre</option><option value="light">Clair</option></select></div><div class="setting"><p id="storageInfo">Connecte-toi pour synchroniser ton historique entre appareils.</p><button class="danger" id="clearHistory">Effacer l'historique</button></div><div class="modal-actions"><button class="side-btn" id="closeSettings" style="width:auto">Fermer</button></div></div>
<div class="modal" id="authModal" role="dialog" aria-modal="true" aria-label="Compte FAUVEL AI"><h2 id="authTitle">Se connecter</h2><div id="signedOut"><form class="auth-form" id="authForm"><input type="email" id="authEmail" placeholder="Adresse e-mail" autocomplete="email" required><input type="password" id="authPassword" placeholder="Mot de passe" autocomplete="current-password" minlength="6" required><button type="submit" id="authSubmit">Se connecter</button></form><div class="auth-links"><button id="switchAuth">Créer un compte</button><button id="resetPassword">Mot de passe oublié ?</button></div></div><div id="signedIn" hidden><p class="notice" id="accountEmail"></p><button class="side-btn" id="logout">Se déconnecter</button></div><p class="notice" id="authNotice" role="status"></p><button class="side-btn" id="closeAuth">Fermer</button></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://ybwsayvezakjuobgmexx.supabase.co";
const SUPABASE_KEY="sb_publishable_TLjvlQYFRIAv1HnFE_Qyxw_Ds_IWXRL";
const API_URL="https://fauvel-ai-api.fauvelangelo1.workers.dev/";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const STORAGE_KEY="fauvel-conversations-v2";
let conversations=[],activeId=null,user=null,busy=false,generation=0,authMode="login",saving=Promise.resolve(),authInitialized=false;
const readJSON=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const uuid=()=>crypto.randomUUID();
function normalizeMessages(messages){return Array.isArray(messages)?messages.filter(m=>m&&["user","assistant"].includes(m.role)&&typeof m.text==="string"):[]}
function loadLocal(){const saved=readJSON(STORAGE_KEY,null);if(Array.isArray(saved)){conversations=saved.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.messages)).map(c=>({...c,messages:normalizeMessages(c.messages)}));}else{const old=readJSON("fauvel-chat",[]);conversations=Array.isArray(old)&&old.length?[{id:uuid(),title:"Ancienne conversation",messages:normalizeMessages(old),updated:Date.now(),model:"general"}]:[];}const last=localStorage.getItem("fauvel-active-id");activeId=conversations.some(c=>c.id===last)?last:conversations[0]?.id||null;}
function persistLocal(){if(user)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(conversations));localStorage.setItem("fauvel-active-id",activeId||"")}catch(e){setStatus("Stockage local plein")}}
function setStatus(message){$("status").textContent=message}
function activeChat(){return conversations.find(c=>c.id===activeId)}
function closeSidebar(){$("sidebar").classList.remove("open");if(!$("settingsModal").classList.contains("show")&&!$("authModal").classList.contains("show"))$("overlay").classList.remove("show")}
function closeModal(id){$(id).classList.remove("show");if(!$("sidebar").classList.contains("open")&&!$("settingsModal").classList.contains("show")&&!$("authModal").classList.contains("show"))$("overlay").classList.remove("show")}
function openModal(id){closeSidebar();$(id).classList.add("show");$("overlay").classList.add("show")}
function renderList(){$("chatList").replaceChildren();[...conversations].sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(c=>{const row=document.createElement("div");row.className="chat-item"+(c.id===activeId?" active":"");const title=document.createElement("button");title.className="chat-title";title.style.cssText="background:transparent;border:0;color:inherit;text-align:left";title.textContent=c.title||"Nouvelle conversation";title.onclick=()=>{activeId=c.id;persistLocal();render();closeSidebar()};const del=document.createElement("button");del.className="delete-btn";del.textContent="×";del.setAttribute("aria-label","Supprimer la conversation");del.onclick=async()=>{if(!confirm("Supprimer cette conversation ?"))return;try{if(user){const {error}=await supabase.from("conversations").delete().eq("id",c.id);if(error)throw error;}generation++;conversations=conversations.filter(x=>x.id!==c.id);if(activeId===c.id)activeId=conversations[0]?.id||null;persistLocal();render()}catch(e){alert("Suppression impossible : "+e.message)}};row.append(title,del);$("chatList").append(row)})}
function renderMessages(){const container=$("messagesInner");container.replaceChildren();const chat=activeChat();if(!chat||!chat.messages.length){const welcome=document.createElement("div");welcome.className="welcome";const logo=document.createElement("div");logo.className="welcome-logo";logo.textContent="F.";const title=document.createElement("h1");title.textContent="Comment puis-je t'aider ?";const description=document.createElement("p");description.textContent="Bienvenue sur FAUVEL AI. Pose ta question pour commencer.";welcome.append(logo,title,description);container.append(welcome)}else{chat.messages.forEach(m=>{const bubble=document.createElement("div");bubble.className="bubble "+m.role;bubble.textContent=m.text;container.append(bubble)})}$("messages").scrollTop=$("messages").scrollHeight}
function render(){renderList();renderMessages();$("accountBtn").textContent=user?"♙ Mon compte":"♙ Se connecter";$("storageInfo").textContent=user?"Historique synchronisé avec ton compte Supabase.":"Historique conservé sur cet appareil uniquement. Connecte-toi pour le synchroniser."}
async function saveConversation(c){if(!user){persistLocal();return}const owner=user.id;const payload={id:c.id,user_id:owner,title:c.title,model:c.model||"general",messages:c.messages,updated_at:new Date(c.updated||Date.now()).toISOString()};saving=saving.catch(()=>{}).then(async()=>{const {error}=await supabase.from("conversations").upsert(payload,{onConflict:"id"});if(error)throw error});return saving}
async function newChat(){generation++;const c={id:uuid(),title:"Nouvelle conversation",model:$("model").value,messages:[],updated:Date.now()};conversations.unshift(c);activeId=c.id;persistLocal();render();closeSidebar();$("prompt").focus();if(user){try{await saveConversation(c)}catch(e){setStatus("Erreur sauvegarde : "+e.message)}}}
function setBusy(value){busy=value;$("send").disabled=value;$("send").textContent=value?"…":"↑";if(!value)setStatus(user?"FAUVEL AI · Historique synchronisé":"FAUVEL AI · Historique local")}
$("form").addEventListener("submit",async event=>{event.preventDefault();if(busy)return;const text=$("prompt").value.trim();if(!text)return;if(!activeChat())await newChat();const c=activeChat();const chatId=c.id;const owner=user?.id||null;const requestId=generation;const mode=$("model").value;c.messages.push({role:"user",text});if(c.title==="Nouvelle conversation")c.title=text.slice(0,45);c.model=mode;c.updated=Date.now();$("prompt").value="";persistLocal();render();setBusy(true);const messages=c.messages.slice(-20).map(m=>({role:m.role,content:m.text}));try{await saveConversation(c);const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,messages})});const data=await response.json();if(!response.ok)throw new Error([data.error,data.detail].filter(Boolean).join(" : ")||"Erreur HTTP "+response.status);if(typeof data.reply!=="string"||!data.reply.trim())throw new Error("Réponse vide du modèle");const target=conversations.find(x=>x.id===chatId);if(target&&requestId===generation&&(user?.id||null)===owner){target.messages.push({role:"assistant",text:data.reply});target.updated=Date.now();persistLocal();render();await saveConversation(target);if(data.fallback)setStatus("Réponse d'un modèle de secours")}}catch(e){const target=conversations.find(x=>x.id===chatId);if(target&&requestId===generation&&(user?.id||null)===owner){target.messages.push({role:"assistant",text:"Erreur : "+e.message});target.updated=Date.now();persistLocal();render();try{await saveConversation(target)}catch(err){setStatus("Erreur de sauvegarde : "+err.message)}}}finally{setBusy(false)}});
$("newChat").onclick=()=>newChat();$("quickNew").onclick=()=>newChat();$("menuBtn").onclick=()=>{$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show",$("sidebar").classList.contains("open"))};$("openSettings").onclick=()=>openModal("settingsModal");$("closeSettings").onclick=()=>closeModal("settingsModal");$("accountBtn").onclick=()=>{refreshAuthUI();openModal("authModal")};$("closeAuth").onclick=()=>closeModal("authModal");$("overlay").onclick=()=>{closeModal("settingsModal");closeModal("authModal");closeSidebar()};
const initialModel=localStorage.getItem("fauvel-model")||"general";if([...$("model").options].some(o=>o.value===initialModel))$("model").value=initialModel;$("settingsModel").value=$("model").value;$("model").onchange=()=>{localStorage.setItem("fauvel-model",$("model").value);$("settingsModel").value=$("model").value};$("settingsModel").onchange=()=>{$("model").value=$("settingsModel").value;$("model").onchange()};const theme=localStorage.getItem("fauvel-theme")||"dark";$("theme").value=theme;document.body.classList.toggle("light",theme==="light");$("theme").onchange=()=>{document.body.classList.toggle("light",$("theme").value==="light");localStorage.setItem("fauvel-theme",$("theme").value)};
$("clearHistory").onclick=async()=>{if(!confirm("Effacer toutes les conversations de ce "+(user?"compte":"navigateur")+" ?"))return;try{if(user){const {error}=await supabase.from("conversations").delete().eq("user_id",user.id);if(error)throw error;}generation++;conversations=[];activeId=null;persistLocal();if(!user){localStorage.removeItem("fauvel-chat")}closeModal("settingsModal");render()}catch(e){alert("Suppression impossible : "+e.message)}};
function refreshAuthUI(){$("signedOut").hidden=!!user;$("signedIn").hidden=!user;$("accountEmail").textContent=user?"Connecté : "+user.email:"";$("authTitle").textContent=user?"Mon compte":authMode==="signup"?"Créer un compte":"Se connecter";$("authSubmit").textContent=authMode==="signup"?"Créer mon compte":"Se connecter";$("switchAuth").textContent=authMode==="signup"?"J'ai déjà un compte":"Créer un compte"}
$("switchAuth").onclick=()=>{authMode=authMode==="signup"?"login":"signup";$("authNotice").textContent="";refreshAuthUI()};
$("authForm").onsubmit=async e=>{e.preventDefault();const email=$("authEmail").value.trim();const password=$("authPassword").value;$("authSubmit").disabled=true;$("authNotice").textContent="Connexion en cours…";try{const result=authMode==="signup"?await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await supabase.auth.signInWithPassword({email,password});if(result.error)throw result.error;$("authNotice").textContent=authMode==="signup"&&!result.data.session?"Compte créé. Vérifie ta boîte e-mail et confirme ton adresse, puis connecte-toi.":"Connexion réussie."}catch(err){$("authNotice").textContent="Erreur : "+err.message}finally{$("authSubmit").disabled=false}};
$("resetPassword").onclick=async()=>{const email=$("authEmail").value.trim();if(!email){$("authNotice").textContent="Saisis d'abord ton adresse e-mail.";return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$("authNotice").textContent=error?"Erreur : "+error.message:"Si cette adresse possède un compte, un e-mail de réinitialisation a été envoyé."};
$("logout").onclick=async()=>{const {error}=await supabase.auth.signOut();if(error){$("authNotice").textContent=error.message;return}closeModal("authModal")};
async function loadCloud(){const {data,error}=await supabase.from("conversations").select("id,title,model,messages,updated_at").order("updated_at",{ascending:false}).limit(200);if(error)throw error;conversations=(data||[]).map(c=>({id:c.id,title:c.title,model:c.model,messages:normalizeMessages(c.messages),updated:Date.parse(c.updated_at)||Date.now()}));activeId=conversations[0]?.id||null;render()}
async function setUser(nextUser){if(authInitialized&&(user?.id||null)===(nextUser?.id||null))return;authInitialized=true;generation++;user=nextUser||null;conversations=[];activeId=null;render();if(user){setStatus("Chargement de l'historique…");try{await loadCloud();setStatus("FAUVEL AI · Historique synchronisé")}catch(e){setStatus("Impossible de charger l'historique : "+e.message)}}else{loadLocal();render();setStatus("FAUVEL AI · Historique local")}refreshAuthUI()}
loadLocal();render();setStatus("FAUVEL AI · Connexion au compte…");supabase.auth.onAuthStateChange((event,session)=>{if(event==="INITIAL_SESSION"||event==="SIGNED_IN"||event==="SIGNED_OUT"){setTimeout(()=>setUser(session?.user||null),0)}});
</script></body></html>
