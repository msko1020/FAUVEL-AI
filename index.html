
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FAUVEL AI</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
  --bg:#0c0c0e;
  --panel:#17171b;
  --surface:#25252b;
  --text:#f7f7f8;
  --muted:#9999a5;
  --line:#303037;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
button,select,textarea,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #aaaaff}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{
  width:280px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:16px;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:18px}
.logo{font-size:30px;font-weight:900;letter-spacing:-3px}
.side-btn,.icon-btn,.chat-item,.model-select{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
}
.side-btn{text-align:left;width:100%}
.icon-btn{padding:9px 12px}
.chat-list{flex:1;overflow-y:auto;min-height:0}
.section-title{color:var(--muted);font-size:12px;margin:10px 0}
.chat-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  width:100%;
  text-align:left;
  margin-bottom:6px;
  border-color:transparent;
}
.chat-item.active{background:#303037}
.chat-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.delete-btn{border:0;background:transparent;color:#b4b4be;padding:4px 7px;font-size:18px}
.settings-btn{border-top:1px solid var(--line);padding-top:14px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:66px;
  flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 16px;
}
.top-left,.top-right{display:flex;align-items:center;gap:10px}
.top-title{font-weight:700}
.model-select{max-width:155px;font-size:13px}
.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:24px 16px;
}
.messages-inner{max-width:780px;margin:auto}
.welcome{text-align:center;margin:18vh auto 0;max-width:360px}
.welcome-logo{font-size:52px;font-weight:900;letter-spacing:-5px}
.welcome h1{font-size:25px;margin:12px 0}
.welcome p{color:var(--muted);line-height:1.5}
.bubble{
  padding:13px 16px;
  border-radius:17px;
  margin:12px 0;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.bubble.user{background:#292930;margin-left:12%}
.bubble.assistant{background:#17171b;border:1px solid var(--line);margin-right:12%}
.composer-wrap{padding:10px 14px max(12px,env(safe-area-inset-bottom))}
.composer{
  max-width:780px;
  margin:auto;
  display:flex;
  gap:10px;
  align-items:end;
  background:#222227;
  border:1px solid #3a3a40;
  border-radius:20px;
  padding:8px;
}
textarea{
  flex:1;
  min-width:0;
  min-height:45px;
  max-height:170px;
  resize:vertical;
  background:transparent;
  color:var(--text);
  border:0;
  outline:none;
  padding:12px;
}
#send{background:#fff;color:#111;border:0;border-radius:13px;width:45px;height:45px;font-weight:700}
.status{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 0}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:10;
}
.overlay.show{display:block}
.modal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(420px,calc(100% - 32px));
  background:#1c1c21;
  border:1px solid #41414a;
  border-radius:20px;
  padding:22px;
  z-index:20;
  display:none;
}
.modal.show{display:block}
.modal h2{margin:0 0 18px}
.setting{margin-bottom:20px}
.setting label{display:block;margin-bottom:8px;color:#b8b8c3;font-size:14px}
.setting select{width:100%;background:#2b2b32;color:white;border:1px solid #45454d;border-radius:12px;padding:12px}
.setting input{accent-color:#fff}
.setting p{font-size:12px;color:var(--muted);line-height:1.5}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.danger{background:#54262b;color:#fff;border:1px solid #773c42;border-radius:12px;padding:11px}
.light{
  --bg:#f6f6f8;
  --panel:#eaeaf0;
  --surface:#dddde5;
  --text:#15151a;
  --muted:#62626c;
  --line:#d0d0d8;
  color-scheme:light;
}
.light .chat-item.active{background:#d6d6df}
.light .bubble.user{background:#dedee6}
.light .bubble.assistant{background:#fff}
.light .composer{background:#fff;border-color:#ccc}
.light .modal{background:#fff}
.light .setting select{background:#f4f4f7;color:#15151a}
.light .delete-btn{color:#555}
.light #send{background:#15151a;color:white}
@media(max-width:700px){
  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:15;
    transform:translateX(-105%);
    transition:transform .2s;
    width:min(290px,85vw);
  }
  .sidebar.open{transform:translateX(0)}
  .topbar{padding:0 12px}
  .top-title{font-size:14px}
  .model-select{max-width:135px}
  .messages{padding:16px 12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">F.</span> FAUVEL AI</div>
    <button class="side-btn" id="newChat">＋ Nouvelle conversation</button>
    <div class="chat-list">
      <div class="section-title">HISTORIQUE</div>
      <div id="chatList"></div>
    </div>
    <div class="settings-btn">
      <button class="side-btn" id="openSettings">⚙ Paramètres</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
        <span class="top-title">FAUVEL AI</span>
      </div>
      <div class="top-right">
        <select class="model-select" id="model" aria-label="Modèle IA">
          <option value="general">Gemma 4 31B</option>
          <option value="gemma">Gemma direct</option>
          <option value="code">Code</option>
          <option value="creative">Créatif</option>
        </select>
        <button class="icon-btn" id="quickNew" aria-label="Nouvelle conversation">＋</button>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite">
      <div class="messages-inner" id="messagesInner"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="prompt" placeholder="Message à FAUVEL AI..." required></textarea>
        <button id="send" type="submit">↑</button>
      </form>
      <div class="status" id="status">FAUVEL AI · Propulsé par OpenRouter</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-label="Paramètres">
  <h2>Paramètres</h2>

  <div class="setting">
    <label for="settingsModel">Modèle par défaut</label>
    <select id="settingsModel">
      <option value="general">Gemma 4 31B</option>
      <option value="gemma">Gemma direct</option>
      <option value="code">Code</option>
      <option value="creative">Créatif</option>
    </select>
  </div>

  <div class="setting">
    <label for="theme">Apparence</label>
    <select id="theme">
      <option value="dark">Sombre</option>
      <option value="light">Clair</option>
    </select>
  </div>

  <div class="setting">
    <label><input type="checkbox" id="saveHistory" checked> Enregistrer l'historique sur cet appareil</label>
    <p>Les conversations sont conservées localement dans ce navigateur. Elles ne sont pas synchronisées entre appareils.</p>
  </div>

  <div class="setting">
    <button class="danger" id="clearHistory">Effacer tout l'historique</button>
  </div>

  <div class="modal-actions">
    <button class="side-btn" id="closeSettings" style="width:auto">Fermer</button>
  </div>
</div>

<script>
const API_URL="https://fauvel-ai-api.fauvelangelo1.workers.dev/";
const STORAGE_KEY="fauvel-conversations-v2";

const $=id=>document.getElementById(id);

let conversations=[];
let activeId=null;
let busy=false;
let requestGeneration=0;
let saveHistory=true;

function readJSON(key,fallback){
  try{return JSON.parse(localStorage.getItem(key))??fallback}
  catch{return fallback}
}

function makeId(){
  return typeof crypto!=="undefined"&&crypto.randomUUID
    ?crypto.randomUUID()
    :Date.now()+"-"+Math.random().toString(36).slice(2);
}

const savedConversations=readJSON(STORAGE_KEY,null);

if(Array.isArray(savedConversations)){
  conversations=savedConversations.filter(c=>
    c&&typeof c.id==="string"&&Array.isArray(c.messages)
  );
}else{
  const oldChat=readJSON("fauvel-chat",[]);
  if(Array.isArray(oldChat)&&oldChat.length){
    conversations=[{
      id:makeId(),
      title:"Ancienne conversation",
      messages:oldChat.filter(m=>
        m&&["user","assistant"].includes(m.role)&&typeof m.text==="string"
      ),
      updated:Date.now()
    }];
  }
}

saveHistory=localStorage.getItem("fauvel-save-history")!=="false";
$("saveHistory").checked=saveHistory;

const storedModel=localStorage.getItem("fauvel-model")||"general";
if([...$("model").options].some(o=>o.value===storedModel)){
  $("model").value=storedModel;
}
$("settingsModel").value=$("model").value;

const storedTheme=localStorage.getItem("fauvel-theme")||"dark";
$("theme").value=storedTheme;
document.body.classList.toggle("light",storedTheme==="light");

function persist(){
  try{
    if(saveHistory){
      localStorage.setItem(STORAGE_KEY,JSON.stringify(conversations));
    }
    localStorage.setItem("fauvel-active-id",activeId||"");
  }catch(e){
    $("status").textContent="Stockage local plein";
  }
}

const lastId=localStorage.getItem("fauvel-active-id");
activeId=conversations.some(c=>c.id===lastId)
  ?lastId
  :conversations[0]?.id||null;

function activeChat(){
  return conversations.find(c=>c.id===activeId);
}

function closeSidebar(){
  $("sidebar").classList.remove("open");
  if(!$("settingsModal").classList.contains("show")){
    $("overlay").classList.remove("show");
  }
}

function openSidebar(){
  $("sidebar").classList.add("open");
  $("overlay").classList.add("show");
}

function closeSettings(){
  $("settingsModal").classList.remove("show");
  $("overlay").classList.remove("show");
}

function renderList(){
  $("chatList").replaceChildren();

  const sorted=[...conversations].sort((a,b)=>(b.updated||0)-(a.updated||0));

  sorted.forEach(c=>{
    const row=document.createElement("div");
    row.className="chat-item"+(c.id===activeId?" active":"");

    const title=document.createElement("button");
    title.className="chat-title";
    title.style.background="transparent";
    title.style.border="0";
    title.style.color="inherit";
    title.style.textAlign="left";
    title.textContent=c.title||"Nouvelle conversation";
    title.onclick=()=>{
      activeId=c.id;
      persist();
      render();
      closeSidebar();
    };

    const del=document.createElement("button");
    del.className="delete-btn";
    del.textContent="×";
    del.setAttribute("aria-label","Supprimer la conversation");
    del.onclick=()=>{
      if(!confirm("Supprimer cette conversation ?"))return;
      requestGeneration++;
      conversations=conversations.filter(x=>x.id!==c.id);
      if(activeId===c.id)activeId=conversations[0]?.id||null;
      persist();
      render();
    };

    row.append(title,del);
    $("chatList").append(row);
  });
}

function renderMessages(){
  const container=$("messagesInner");
  container.replaceChildren();

  const chat=activeChat();

  if(!chat||!chat.messages.length){
    const welcome=document.createElement("div");
    welcome.className="welcome";

    const logo=document.createElement("div");
    logo.className="welcome-logo";
    logo.textContent="F.";

    const title=document.createElement("h1");
    title.textContent="Comment puis-je t'aider ?";

    const description=document.createElement("p");
    description.textContent="Bienvenue sur FAUVEL AI. Pose ta question pour commencer.";

    welcome.append(logo,title,description);
    container.append(welcome);
  }else{
    chat.messages.forEach(m=>{
      const bubble=document.createElement("div");
      bubble.className="bubble "+m.role;
      bubble.textContent=m.text;
      container.append(bubble);
    });
  }

  $("messages").scrollTop=$("messages").scrollHeight;
}

function render(){
  renderList();
  renderMessages();
}

function newChat(){
  requestGeneration++;
  const chat={
    id:makeId(),
    title:"Nouvelle conversation",
    messages:[],
    updated:Date.now()
  };
  conversations.unshift(chat);
  activeId=chat.id;
  persist();
  render();
  closeSidebar();
  $("prompt").focus();
}

function setBusy(value){
  busy=value;
  $("send").disabled=value;
  $("send").textContent=value?"…":"↑";
  $("status").textContent=value
    ?"FAUVEL AI réfléchit…"
    :"FAUVEL AI · Propulsé par OpenRouter";
}

$("form").addEventListener("submit",async event=>{
  event.preventDefault();
  if(busy)return;

  const text=$("prompt").value.trim();
  if(!text)return;

  if(!activeChat())newChat();

  const chat=activeChat();
  const chatId=chat.id;
  const generation=requestGeneration;
  const mode=$("model").value;

  chat.messages.push({role:"user",text});
  if(chat.title==="Nouvelle conversation"){
    chat.title=text.slice(0,45);
  }
  chat.updated=Date.now();

  $("prompt").value="";
  persist();
  render();
  setBusy(true);

  const messages=chat.messages.slice(-20).map(m=>({
    role:m.role,
    content:m.text
  }));

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mode,messages})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        [data.error,data.detail].filter(Boolean).join(" : ")||
        "Erreur HTTP "+response.status
      );
    }

    if(typeof data.reply!=="string"||!data.reply.trim()){
      throw new Error("Réponse vide du modèle");
    }

    const target=conversations.find(c=>c.id===chatId);
    if(target&&generation===requestGeneration){
      target.messages.push({role:"assistant",text:data.reply});
      target.updated=Date.now();
      persist();
      render();
      if(data.fallback){
        $("status").textContent="Réponse fournie par un modèle de secours";
      }
    }
  }catch(error){
    const target=conversations.find(c=>c.id===chatId);
    if(target&&generation===requestGeneration){
      target.messages.push({
        role:"assistant",
        text:"Erreur : "+error.message
      });
      persist();
      render();
    }
  }finally{
    setBusy(false);
  }
});

$("newChat").onclick=newChat;
$("quickNew").onclick=newChat;

$("menuBtn").onclick=()=>{
  if($("sidebar").classList.contains("open")){
    closeSidebar();
  }else{
    openSidebar();
  }
};

$("openSettings").onclick=()=>{
  closeSidebar();
  $("settingsModal").classList.add("show");
  $("overlay").classList.add("show");
};

$("closeSettings").onclick=closeSettings;

$("overlay").onclick=()=>{
  closeSettings();
  closeSidebar();
};

$("model").onchange=()=>{
  localStorage.setItem("fauvel-model",$("model").value);
  $("settingsModel").value=$("model").value;
};

$("settingsModel").onchange=()=>{
  $("model").value=$("settingsModel").value;
  localStorage.setItem("fauvel-model",$("model").value);
};

$("theme").onchange=()=>{
  const theme=$("theme").value;
  document.body.classList.toggle("light",theme==="light");
  localStorage.setItem("fauvel-theme",theme);
};

$("saveHistory").onchange=()=>{
  saveHistory=$("saveHistory").checked;
  localStorage.setItem("fauvel-save-history",String(saveHistory));
  if(saveHistory){
    persist();
  }else{
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem("fauvel-chat");
  }
};

$("clearHistory").onclick=()=>{
  if(!confirm("Effacer toutes les conversations ?"))return;
  requestGeneration++;
  conversations=[];
  activeId=null;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem("fauvel-chat");
  localStorage.removeItem("fauvel-active-id");
  closeSettings();
  render();
};

render();
</script>
</body>
</html>
