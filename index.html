<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0c0e"><meta name="apple-mobile-web-app-capable" content="yes"><title>FAUVEL AI</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c0c0e;color:#f7f7f8}header{height:64px;border-bottom:1px solid #26262a;display:flex;align-items:center;justify-content:space-between;padding:0 18px}button{background:#242429;color:white;border:1px solid #37373e;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #a8a8ff}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px}.brand img{width:33px;height:33px}main{max-width:780px;margin:auto;height:calc(100dvh - 64px);display:flex;flex-direction:column}.messages{flex:1;overflow-y:auto;padding:24px 16px}.welcome{text-align:center;margin:18vh auto 0;max-width:320px}.welcome h1{font-size:27px;margin-bottom:8px}.welcome p{color:#a2a2ad;line-height:1.5}.bubble{padding:13px 16px;border-radius:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.user{background:#292930;margin-left:12%;}.assistant{background:#17171b;margin-right:12%;border:1px solid #29292e}.composer{padding:12px 14px max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:end;border-top:1px solid #26262a;background:#0c0c0e}textarea{flex:1;min-height:46px;max-height:150px;resize:vertical;border-radius:16px;background:#222227;color:#fff;border:1px solid #3a3a40;padding:13px;font:inherit}#send{background:#fff;color:#111;font-weight:700}small{color:#858590;display:block;text-align:center;padding-bottom:5px}
</style></head><body><header><div class="brand"><img src="icon.svg" alt="Logo FAUVEL AI">FAUVEL AI</div><button id="new">+ Nouveau</button></header><main><section class="messages" id="messages" aria-live="polite"></section><form class="composer" id="form"><textarea id="prompt" placeholder="Message à FAUVEL AI..." aria-label="Votre message" required></textarea><button id="send" type="submit">↑</button></form><small>Prototype local · Moteur IA non connecté</small></main><script>
const messages=document.getElementById('messages'),prompt=document.getElementById('prompt');let chat=[];try{chat=JSON.parse(localStorage.getItem('fauvel-chat')||'[]')}catch{}function render(){messages.replaceChildren();if(!chat.length){const w=document.createElement('div');w.className='welcome';const h=document.createElement('h1');h.textContent='Comment puis-je t’aider ?';const p=document.createElement('p');p.textContent='Bienvenue sur FAUVEL AI. Le moteur IA sera connecté à la prochaine étape.';w.append(h,p);messages.append(w)}else chat.forEach(m=>{const b=document.createElement('div');b.className='bubble '+m.role;b.textContent=m.text;messages.append(b)});messages.scrollTop=messages.scrollHeight}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const text=prompt.value.trim();if(!text)return;chat.push({role:'user',text});chat.push({role:'assistant',text:'FAUVEL AI est en cours de configuration. Le modèle IA n’est pas encore connecté.'});localStorage.setItem('fauvel-chat',JSON.stringify(chat));prompt.value='';render()});document.getElementById('new').addEventListener('click',()=>{chat=[];localStorage.removeItem('fauvel-chat');render()});render();
</script></body></html>
