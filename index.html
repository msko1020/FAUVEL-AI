
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FAUVEL AI</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0c0c0e;color:#f7f7f8}
header{min-height:68px;border-bottom:1px solid #29292e;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.brand img{width:32px;height:32px}
button,select{background:#242429;color:#fff;border:1px solid #37373e;border-radius:12px;padding:10px;font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #aaaaff}
.controls{display:flex;gap:8px;align-items:center}
select{max-width:155px;font-size:13px}
#new{font-size:13px;white-space:nowrap}
main{max-width:780px;margin:auto;height:calc(100dvh - 68px);display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:20px 16px}
.welcome{text-align:center;margin:18vh auto 0;max-width:330px}
.welcome h1{font-size:26px}
.welcome p{color:#a2a2ad;line-height:1.5}
.bubble{padding:13px 16px;border-radius:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.user{background:#292930;margin-left:12%}
.assistant{background:#17171b;margin-right:12%;border:1px solid #29292e}
.composer{padding:12px 14px max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:end;border-top:1px solid #26262a;background:#0c0c0e}
textarea{flex:1;min-width:0;min-height:46px;max-height:150px;resize:vertical;border-radius:16px;background:#222227;color:#fff;border:1px solid #3a3a40;padding:13px;font:inherit}
#send{background:#fff;color:#111;font-weight:700;min-width:48px;height:48px}
small{color:#858590;display:block;text-align:center;padding:4px 8px 8px;font-size:11px}
@media(max-width:390px){header{padding:10px 8px}.brand{font-size:13px}.brand img{width:25px;height:25px}select{max-width:115px}#new{padding:9px 7px;font-size:12px}}
</style>
</head>
<body>
<header>
<div class="brand">
<img src="icon.svg" alt="FAUVEL AI">
<span>FAUVEL AI</span>
</div>
<div class="controls">
<select id="model" aria-label="Modèle IA">
<option value="general">Gemma 4 31B</option>
<option value="gemma">Gemma direct</option>
<option value="code">Code</option>
<option value="creative">Créatif</option>
</select>
<button id="new">+ Nouveau</button>
</div>
</header>

<main>
<section class="messages" id="messages" aria-live="polite"></section>
<form class="composer" id="form">
<textarea id="prompt" placeholder="Message à FAUVEL AI..." aria-label="Votre message" required></textarea>
<button id="send" type="submit">↑</button>
</form>
<small id="status">FAUVEL AI · Connecté via Cloudflare et OpenRouter</small>
</main>

<script>
const API_URL="https://fauvel-ai-api.fauvelangelo1.workers.dev/";

const messages=document.getElementById("messages");
const promptInput=document.getElementById("prompt");
const modelSelect=document.getElementById("model");
const sendButton=document.getElementById("send");
const statusEl=document.getElementById("status");

let chat=[];
let busy=false;
let generation=0;

try{
 const saved=JSON.parse(localStorage.getItem("fauvel-chat")||"[]");
 if(Array.isArray(saved)){
  chat=saved.filter(m=>m&&["user","assistant"].includes(m.role)&&typeof m.text==="string");
 }
}catch(e){chat=[]}

const savedModel=localStorage.getItem("fauvel-model");
if([...modelSelect.options].some(o=>o.value===savedModel)){
 modelSelect.value=savedModel;
}

modelSelect.addEventListener("change",()=>{
 localStorage.setItem("fauvel-model",modelSelect.value);
});

function save(){
 try{
  localStorage.setItem("fauvel-chat",JSON.stringify(chat));
 }catch(e){
  statusEl.textContent="Stockage local plein";
 }
}

function render(){
 messages.replaceChildren();
 if(!chat.length){
  const welcome=document.createElement("div");
  welcome.className="welcome";
  const title=document.createElement("h1");
  title.textContent="Comment puis-je t’aider ?";
  const description=document.createElement("p");
  description.textContent="Bienvenue sur FAUVEL AI. Choisis ton modèle et commence une conversation.";
  welcome.append(title,description);
  messages.append(welcome);
 }else{
  chat.forEach(m=>{
   const bubble=document.createElement("div");
   bubble.className="bubble "+m.role;
   bubble.textContent=m.text;
   messages.append(bubble);
  });
 }
 messages.scrollTop=messages.scrollHeight;
}

function setBusy(value){
 busy=value;
 sendButton.disabled=value;
 modelSelect.disabled=value;
 sendButton.textContent=value?"…":"↑";
 statusEl.textContent=value?"FAUVEL AI réfléchit…":"FAUVEL AI · Connecté via Cloudflare et OpenRouter";
}

document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 if(busy)return;
 const text=promptInput.value.trim();
 if(!text)return;

 const currentGeneration=generation;
 const selectedModel=modelSelect.value;

 chat.push({role:"user",text});
 promptInput.value="";
 save();
 render();
 setBusy(true);

 const history=chat.slice(-20).map(m=>({
  role:m.role,
  content:m.text
 }));

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    mode:selectedModel,
    messages:history
   })
  });

  const data=await response.json();
  if(!response.ok){
   throw new Error(data.error||"Erreur HTTP "+response.status);
  }

  const answer=data.reply;
  if(typeof answer!=="string"||!answer.trim()){
   throw new Error("Réponse vide du modèle");
  }

  if(currentGeneration===generation){
   chat.push({role:"assistant",text:answer});
   save();
   render();
  }
 }catch(error){
  if(currentGeneration===generation){
   chat.push({
    role:"assistant",
    text:"Erreur de connexion : "+error.message
   });
   save();
   render();
  }
 }finally{
  setBusy(false);
 }
});

document.getElementById("new").addEventListener("click",()=>{
 generation++;
 chat=[];
 save();
 render();
});

render();
</script>
</body>
</html>
