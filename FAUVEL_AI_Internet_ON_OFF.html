function setBusy(value){busy=value;document.body.classList.toggle("thinking",value);$("send").disabled=value;$("send").textContent=value?"…":"↑";if(!value)setStatus(user?"FAUVEL AI · Historique synchronisé":"FAUVEL AI · Historique local")}
$("form").addEventListener("submit",async event=>{event.preventDefault();if(busy)return;const text=$("prompt").value.trim();if(!text)return;if(!activeChat())await newChat();const c=activeChat();const chatId=c.id;const owner=user?.id||null;const requestId=generation;const mode=$("model").value;c.messages.push({role:"user",text});if(c.title==="Nouvelle conversation")c.title=text.slice(0,45);c.model=mode;c.updated=Date.now();$("prompt").value="";persistLocal();render();setBusy(true);const messages=c.messages.slice(-20).map(m=>({role:m.role,content:m.text}));try{await saveConversation(c);const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,messages,web_search:webEnabled})});const data=await response.json();if(!response.ok)throw new Error([data.error,data.detail].filter(Boolean).join(" : ")||"Erreur HTTP "+response.status);if(typeof data.reply!=="string"||!data.reply.trim())throw new Error("Réponse vide du modèle");const target=conversations.find(x=>x.id===chatId);if(target&&requestId===generation&&(user?.id||null)===owner){target.messages.push({role:"assistant",text:data.reply});target.updated=Date.now();persistLocal();render();await saveConversation(target);if(data.fallback)setStatus("Réponse d'un modèle de secours")}}catch(e){const target=conversations.find(x=>x.id===chatId);if(target&&requestId===generation&&(user?.id||null)===owner){target.messages.push({role:"assistant",text:"Erreur : "+e.message});target.updated=Date.now();persistLocal();render();try{await saveConversation(target)}catch(err){setStatus("Erreur de sauvegarde : "+err.message)}}}finally{setBusy(false)}});
$("newChat").onclick=()=>newChat();$("quickNew").onclick=()=>newChat();$("menuBtn").onclick=()=>{$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show",$("sidebar").classList.contains("open"))};$("openSettings").onclick=()=>openModal("settingsModal");$("closeSettings").onclick=()=>closeModal("settingsModal");$("accountBtn").onclick=()=>{refreshAuthUI();openModal("authModal")};$("closeAuth").onclick=()=>closeModal("authModal");$("overlay").onclick=()=>{closeModal("settingsModal");closeModal("authModal");closeSidebar()};
const initialModel=localStorage.getItem("fauvel-model")||"general";if([...$("model").options].some(o=>o.value===initialModel))$("model").value=initialModel;$("settingsModel").value=$("model").value;$("model").onchange=()=>{localStorage.setItem("fauvel-model",$("model").value);$("settingsModel").value=$("model").value};$("settingsModel").onchange=()=>{$("model").value=$("settingsModel").value;$("model").onchange()};const theme=localStorage.getItem("fauvel-theme")||"dark";$("theme").value=theme;document.body.classList.toggle("light",theme==="light");$("theme").onchange=()=>{document.body.classList.toggle("light",$("theme").value==="light");localStorage.setItem("fauvel-theme",$("theme").value)};
$("clearHistory").onclick=async()=>{if(!confirm("Effacer toutes les conversations de ce "+(user?"compte":"navigateur")+" ?"))return;try{if(user){const {error}=await supabase.from("conversations").delete().eq("user_id",user.id);if(error)throw error;}generation++;conversations=[];activeId=null;persistLocal();if(!user){localStorage.removeItem("fauvel-chat")}closeModal("settingsModal");render()}catch(e){alert("Suppression impossible : "+e.message)}};
function refreshAuthUI(){$("signedOut").hidden=!!user;$("signedIn").hidden=!user;$("accountEmail").textContent=user?"Connecté : "+user.email:"";$("authTitle").textContent=user?"Mon compte":authMode==="signup"?"Créer un compte":"Se connecter";$("authSubmit").textContent=authMode==="signup"?"Créer mon compte":"Se connecter";$("switchAuth").textContent=authMode==="signup"?"J'ai déjà un compte":"Créer un compte"}
$("switchAuth").onclick=()=>{authMode=authMode==="signup"?"login":"signup";$("authNotice").textContent="";refreshAuthUI()};
$("authForm").onsubmit=async e=>{e.preventDefault();const email=$("authEmail").value.trim();const password=$("authPassword").value;$("authSubmit").disabled=true;$("authNotice").textContent="Connexion en cours…";try{const result=authMode==="signup"?await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await supabase.auth.signInWithPassword({email,password});if(result.error)throw result.error;$("authNotice").textContent=authMode==="signup"&&!result.data.session?"Compte créé. Vérifie ta boîte e-mail et confirme ton adresse, puis connecte-toi.":"Connexion réussie."}catch(err){$("authNotice").textContent="Erreur : "+err.message}finally{$("authSubmit").disabled=false}};
$("resetPassword").onclick=async()=>{const email=$("authEmail").value.trim();if(!email){$("authNotice").textContent="Saisis d'abord ton adresse e-mail.";return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$("authNotice").textContent=error?"Erreur : "+error.message:"Si cette adresse possède un compte, un e-mail de réinitialisation a été envoyé."};
$("logout").onclick=async()=>{const {error}=await supabase.auth.signOut();if(error){$("authNotice").textContent=error.message;return}closeModal("authModal")};
async function loadCloud(){const {data,error}=await supabase.from("conversations").select("id,title,model,messages,updated_at").order("updated_at",{ascending:false}).limit(200);if(error)throw error;conversations=(data||[]).map(c=>({id:c.id,title:c.title,model:c.model,messages:normalizeMessages(c.messages),updated:Date.parse(c.updated_at)||Date.now()}));activeId=conversations[0]?.id||null;render()}
async function setUser(nextUser){if(authInitialized&&(user?.id||null)===(nextUser?.id||null))return;authInitialized=true;generation++;user=nextUser||null;conversations=[];activeId=null;render();if(user){setStatus("Chargement de l'historique…");try{await loadCloud();setStatus("FAUVEL AI · Historique synchronisé")}catch(e){setStatus("Impossible de charger l'historique : "+e.message)}}else{loadLocal();render();setStatus("FAUVEL AI · Historique local")}refreshAuthUI()}
loadLocal();render();setStatus("FAUVEL AI · Connexion au compte…");supabase.auth.onAuthStateChange((event,session)=>{if(event==="INITIAL_SESSION"||event==="SIGNED_IN"||event==="SIGNED_OUT"){setTimeout(()=>setUser(session?.user||null),0)}});
</script></body></html>
